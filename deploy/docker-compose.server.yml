# Ecommerce on the shared server (next to PingCrood, LiverLens, RAG, portfolio).
# No host ports: chat-nest-nginx reaches ecommerce-app and ecommerce-minio over the shared
# Docker network; Postgres, Redis and the support assistant stay on the private network.
# Used by deploy/server.sh — run that instead of this file directly.
name: ecommerce

services:
  ecommerce-db:
    image: pgvector/pgvector:pg16
    container_name: ecommerce-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ecommerce
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.server}
      POSTGRES_DB: ecommerce
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ecommerce -d ecommerce']
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [internal]

  ecommerce-redis:
    image: redis:7-alpine
    container_name: ecommerce-redis
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [internal]

  ecommerce-minio:
    image: ${MINIO_IMAGE:-pgsty/minio:latest} # community build; MinIO no longer publishes images
    container_name: ecommerce-minio
    restart: unless-stopped
    command: ['server', '/data', '--console-address', ':9001']
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:?set S3_ACCESS_KEY in .env.server}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:?set S3_SECRET_KEY in .env.server}
    volumes:
      - miniodata:/data
    networks: [internal, proxy] # proxy: public images at media.shop.*

  ecommerce-support:
    build:
      context: ../services/support-ai
    container_name: ecommerce-support
    restart: unless-stopped
    env_file: [../.env.server]
    depends_on:
      ecommerce-db:
        condition: service_healthy
    networks: [internal]

  ecommerce-app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
        NEXT_PUBLIC_ADMIN_URL: ${NEXT_PUBLIC_ADMIN_URL}
        NEXT_PUBLIC_VENDOR_URL: ${NEXT_PUBLIC_VENDOR_URL}
    image: ecommerce-app:latest
    container_name: ecommerce-app
    restart: unless-stopped
    env_file: [../.env.server]
    depends_on:
      ecommerce-db:
        condition: service_healthy
      ecommerce-redis:
        condition: service_healthy
      ecommerce-minio:
        condition: service_started
    networks: [internal, proxy] # proxy: storefront, admin, seller, API

volumes:
  pgdata:
  redisdata:
  miniodata:

networks:
  internal: {}
  proxy:
    external: true
    name: chat-nest-backend_default # chat-nest-nginx's network (same as RAG)
