# Reverse proxy on the host → the single app container (ports bound to 127.0.0.1 by deploy.sh).
# /etc/nginx/conf.d/ecommerce.conf, then: sudo certbot --nginx -d example.com -d admin.example.com -d seller.example.com -d api.example.com

map $http_upgrade $connection_upgrade { default upgrade; '' close; }

upstream ecommerce_web    { server 127.0.0.1:3000; }
upstream ecommerce_admin  { server 127.0.0.1:3001; }
upstream ecommerce_vendor { server 127.0.0.1:3002; }
upstream ecommerce_api    { server 127.0.0.1:4000; }

server {
  listen 80;
  server_name example.com www.example.com;
  location / { proxy_pass http://ecommerce_web; include /etc/nginx/ecommerce_proxy.conf; }
}

server {
  listen 80;
  server_name admin.example.com;
  location / { proxy_pass http://ecommerce_admin; include /etc/nginx/ecommerce_proxy.conf; }
}

server {
  listen 80;
  server_name seller.example.com;
  location / { proxy_pass http://ecommerce_vendor; include /etc/nginx/ecommerce_proxy.conf; }
}

server {
  listen 80;
  server_name api.example.com;
  client_max_body_size 20m;   # image uploads
  location / { proxy_pass http://ecommerce_api; include /etc/nginx/ecommerce_proxy.conf; }
}

